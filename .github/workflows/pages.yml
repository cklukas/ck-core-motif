name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'ckdocs.yml'
      - 'scripts/build-docs.py'
      - '.ckgit/ci.yml'
      - '.ckgit/build-commit'
      - '.gitattributes'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'ckdocs.yml'
      - 'scripts/build-docs.py'
      - '.ckgit/ci.yml'
      - '.ckgit/build-commit'
      - '.gitattributes'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned documentation tool
        uses: actions/checkout@v5
        with:
          repository: cklukas/ck-git-hosting
          ref: 5019729cd37c06ae4e0c1d2c07e4127f3a72394d
          path: .docs-tool
          persist-credentials: false
      - name: Install compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential flex git libfontconfig1-dev \
            libfreetype6-dev libjpeg-dev libpng-dev libx11-dev libxext-dev \
            libxfixes-dev libxft-dev libxmu-dev libxpm-dev libxrender-dev \
            libxt-dev libxtst-dev libxau-dev libxdmcp-dev libxcb1-dev \
            libatspi2.0-dev libicu-dev libdbus-1-dev libharfbuzz-dev \
            libtool pkg-config \
            libxcomposite-dev libxcursor-dev libxdamage-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxss-dev \
            python3 xvfb x11-utils netpbm
      - name: Build current gallery and refresh screenshots
        run: |
          gallery_work="$RUNNER_TEMP/motif-gallery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          prefix="$gallery_work/prefix"
          mkdir -p "$gallery_work/build" "$prefix"
          (cd "$gallery_work/build" && "$GITHUB_WORKSPACE/configure" --prefix="$prefix" \
            --enable-xft --enable-unicode-text --enable-atspi) \
            > "$gallery_work/configure.log" 2>&1
          make -C "$gallery_work/build" -j2 > "$gallery_work/build.log" 2>&1
          make -C "$gallery_work/build" install > "$gallery_work/install.log" 2>&1
          capture="$RUNNER_TEMP/motif-gallery-capture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          xvfb-run -a -s "-screen 0 1600x1000x24" env \
            LD_LIBRARY_PATH="$prefix/lib" \
            python3 scripts/refresh-gallery-screenshots.py \
            --binary "$prefix/bin/ckmotif-gallery" --work "$capture"
      - name: Build pinned tool and strict documentation
        run: |
          python3 scripts/build-docs.py \
            --tool-source "$GITHUB_WORKSPACE/.docs-tool" \
            --work "$RUNNER_TEMP/motif-docs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --site-url https://cklukas.github.io/ck-core-motif/
      - name: Record validation evidence
        if: always()
        run: |
          receipt="$RUNNER_TEMP/motif-docs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.json"
          if [ -f "$receipt" ]; then cat "$receipt"; fi
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v5
